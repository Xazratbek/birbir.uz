services:
  web:
    container_name: web
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/birbiruz
    environment:
      - DB_HOST=database
      - DB_NAME=birbiuz
      - DB_USER=xazratbek
      - DB_PASSWORD=196712
      - DB_PORT=5432
    command: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 6  --timeout 120 --reload"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    container_name: database
    environment:
      - POSTGRES_DB=birbiuz
      - POSTGRES_USER=xazratbek
      - POSTGRES_PASSWORD=196712
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xazratbek", "-d", "birbiuz"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8.4-alpine
    hostname: redis

  worker:
    build:
      context: .
    container_name: worker
    hostname: worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/birbiruz
    links:
      - redis
    depends_on:
      - redis

  dashboard:
    build:
      context: .
    container_name: flower
    command: celery -A config flower --port=5555
    hostname: flower
    environment:
          - DB_HOST=database
          - DB_NAME=birbiuz
          - DB_USER=xazratbek
          - DB_PASSWORD=196712
          - DB_PORT=5432
          - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - .:/birbiruz
    links:
      - redis
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    ports:
      - "5555:5555"


volumes:
  postgres_data:
